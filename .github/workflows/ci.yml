# Continuous integration: every push and pull request is checked the same way the app is tested locally.
# Windows runners are used because the app is developed on Windows and the browser tests drive Microsoft Edge.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the Release workflow runs these checks before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Secrets guard, syntax and unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # User data (data/, backups/, databases) and API keys must never reach GitHub.
      - name: No private data or secrets in the repository
        run: |
          files=$(git ls-files | grep -E '(^|/)(data|backups)/|\.env($|\.)|\.(db|db-journal|db-wal|db-shm|sqlite3?|pem|key)$' || true)
          if [ -n "$files" ]; then echo "::error::These files must not be committed:"; echo "$files"; exit 1; fi
          if git grep -nIE 'gsk_[A-Za-z0-9]{20,}|sk-or-v1-[0-9a-f]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- .; then
            echo "::error::An API key or private key is committed. Remove it, then create a new key (the old one is public now)."; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Optional marketplace packages (PDF previews are tested)
        run: python -m pip install -r requirements-marketplace.txt

      - name: JavaScript syntax
        run: for f in $(git ls-files 'frontend/*.js' 'tests/*.js'); do node --check "$f" || exit 1; done

      - name: Python and Node tests
        run: python tests/support/run_tests.py

  browser:
    name: Browser tests (${{ matrix.name }})
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Notes', command: 'python tests/support/run_tests.py --no-unit --notes' }
          - { name: 'Dashboard', command: 'python tests/support/run_tests.py --no-unit --dashboard' }
          - { name: 'Chatbot', command: 'python tests/support/run_tests.py --no-unit --browser' }
          - { name: 'Accounts', command: 'python tests/support/run_tests.py --no-unit --accounts' }
          - { name: 'Gym', command: 'python tests/support/run_tests.py --no-unit --gym' }
          - { name: 'Quizzes', command: 'python tests/support/run_browser_check.py && python tests/support/run_browser_check.py --timer && python tests/support/run_browser_check.py --reshuffle && python tests/support/run_browser_check.py --quick' }
          - { name: 'Deep Practice and CTF', command: 'python tests/support/run_browser_check.py --deep && python tests/support/run_browser_check.py --ctf' }
          - { name: 'Social and sharing', command: 'python tests/support/run_browser_check.py --social && python tests/support/run_browser_check.py --share && python tests/support/run_browser_check.py --calls' }
          - { name: 'Finance, planner and navigation', command: 'python tests/support/run_browser_check.py --finance && python tests/support/run_browser_check.py --colours && python tests/support/run_browser_check.py --navigation && python tests/support/run_browser_check.py --assistant' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Optional marketplace packages
        run: python -m pip install -r requirements-marketplace.txt
      - name: Run
        # The browser tests save screenshots in the temp folder; keep them where they can be uploaded.
        # (The runner context exists only inside steps, so this cannot be set for the whole job.)
        # Browser tests on a shared cloud machine occasionally stumble on timing; one retry keeps CI dependable,
        # and the warning it leaves on the run keeps a flaky test visible instead of hidden.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          ${{ matrix.command }} || { echo "::warning title=Browser tests retried::'${{ matrix.name }}' failed once and was run again. If this keeps happening, a test is flaky."; ${{ matrix.command }}; }
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ strategy.job-index }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
          retention-days: 7
